    <div class="nav-brand">
      <a href="#" onclick="groupNavigateToPage(''); return false;"><img src="NipponMboa-Logo.png" alt="NipponMboa" class="brand-logo" /></a>
    </div>
    <div class="nav-links">

    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="fr">FR</button>

  <!-- HERO -->
  <section class="hero hero-foundation">

    <div class="hero-inner">
      <img src="NipponMboaFoundation-Logo.png" alt="NipponMboa Foundation" class="foundation-logo" />

      <p class="hero-sub" data-i18n="f_hero_sub"></p>
      <div class="hero-cta">
        <a href="#mission" class="btn btn-primary" data-i18n="f_hero_cta1"></a>
        <a href="#donate" class="btn btn-outline" data-i18n="f_hero_cta2"></a>
      </div>
    </div>
  </section>

      <span class="section-title-underline">

      <span class="section-title-underline">

      <p class="board-sub" data-i18n="f_board_subtitle"></p>
      <div class="board-grid">
        <div class="board-card">
          <img src="board-omoko-brigitte.jpeg" alt="Omoko Brigitte" class="board-photo board-photo-top" />

          <div class="board-role" data-i18n="f_role_president"></div>

        <div class="board-card">

          <div class="board-role" data-i18n="f_role_vp"></div>
        </div>
        <div class="board-card">
          <img src="SG_photo.jpeg" alt="Bikolene Wilfried" class="board-photo board-photo-face" />

          <div class="board-role" data-i18n="f_role_sg"></div>
        </div>
        <div class="board-card">
          <img src="Tresorer_photo.jpeg" alt="Mengue Cédric" class="board-photo board-photo-face" />
          <div class="board-name" data-i18n="f_name_treasurer"></div>
          <div class="board-role" data-i18n="f_role_treasurer"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-alt" id="blog">
    <div class="container">
      <span class="section-title-underline">

        <p data-i18n="f_blog_soon_text"></p>

    </div>

  <section class="section" id="donate">

      <div class="cta-band cta-green">

        <div class="contact-tile">
          <div class="c-label" data-i18n="contact_pobox_label"></div>
          <div class="c-value" data-i18n="contact_pobox_value"></div>
